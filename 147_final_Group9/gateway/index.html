<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackSense BLE Probe</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    margin: 0;
    padding: 12px;
    background: #111;
    color: #eee;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
  h2 { font-size: 14px; font-weight: 500; margin: 16px 0 6px; color: #aaa; }
  button {
    font-size: 16px;
    padding: 12px 20px;
    margin: 0 8px 12px 0;
    border: 1px solid #555;
    border-radius: 6px;
    background: #222;
    color: #eee;
  }
  button:disabled { opacity: 0.4; }
  label { font-size: 14px; color: #aaa; margin-left: 4px; }
  #stats { font-size: 14px; margin-bottom: 10px; color: #9c9; }
  #log {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px;
    height: 32vh;
    overflow-y: auto;
  }
  canvas {
    width: 100%;
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
  }
  .err  { color: #f77; }
  .ok   { color: #7d7; }
  .rep  { color: #fc7; }
  .sum  { color: #9cf; }
  .hex  { color: #666; font-size: 11px; }
</style>
</head>
<body>

<h1>StackSense BLE Probe</h1>

<button id="connectBtn">Connect</button>
<button id="clearBtn">Clear</button>
<button id="csvBtn" disabled>Download CSV</button>
<input type="checkbox" id="hexToggle"><label for="hexToggle">show raw hex</label>

<div id="stats">packets: 0 &nbsp; bytes: 0 &nbsp; samples: 0</div>
<div id="log"></div>

<h2>Height (mm) vs time (s)</h2>
<canvas id="heightChart" height="220"></canvas>

<h2>Acceleration (milli-g from resting) vs time (s)</h2>
<canvas id="accelChart" height="160"></canvas>

<script>
// Must match the firmware. Web Bluetooth requires lowercase UUIDs.
const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

const PKT_SAMPLES     = 0x01;
const PKT_SET_SUMMARY = 0x02;
const PKT_TX_END      = 0x03;
const PKT_REP         = 0x05;

const SAMPLE_BYTES = 5;

const logEl      = document.getElementById('log');
const statsEl    = document.getElementById('stats');
const connectBtn = document.getElementById('connectBtn');
const hexToggle  = document.getElementById('hexToggle');
const csvBtn     = document.getElementById('csvBtn');

let packetCount = 0;
let byteCount = 0;
let samples = [];        // { t, height, accel }
let elapsedMs = 0;
let expectedSeq = 0;

// Bluefy has no developer console, so every message has to land on the page.
function log(text, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function logHex(dv) {
  if (!hexToggle.checked) return;
  const parts = [];
  for (let i = 0; i < dv.byteLength; i++) {
    parts.push(dv.getUint8(i).toString(16).padStart(2, '0'));
  }
  log('    ' + parts.join(' '), 'hex');
}

function updateStats() {
  statsEl.textContent =
    `packets: ${packetCount}   bytes: ${byteCount}   samples: ${samples.length}`;
}

function handleSamples(dv, seq, len) {
  // A new set starts over at sequence zero.
  if (seq === 0) {
    samples = [];
    elapsedMs = 0;
    expectedSeq = 0;
  }

  if (seq !== expectedSeq) {
    log(`  gap: expected packet ${expectedSeq}, got ${seq}`, 'err');
  }
  expectedSeq = seq + 1;

  const count = len / SAMPLE_BYTES;
  const startMs = elapsedMs;
  let minH = Infinity, maxH = -Infinity;

  for (let i = 0; i < count; i++) {
    const o = 4 + i * SAMPLE_BYTES;
    const dt     = dv.getUint8(o);
    const height = dv.getInt16(o + 1, true);
    const accel  = dv.getInt16(o + 3, true);

    elapsedMs += dt;
    samples.push({ t: elapsedMs, height: height, accel: accel });

    if (height < minH) minH = height;
    if (height > maxH) maxH = height;
  }

  log(`packet ${seq}: ${count} samples, ` +
      `${(startMs / 1000).toFixed(2)}-${(elapsedMs / 1000).toFixed(2)}s, ` +
      `height ${minH} to ${maxH} mm`);
}

function handleRep(dv) {
  const index    = dv.getUint16(4, true);
  const rom      = dv.getUint16(6, true);
  const duration = dv.getUint16(8, true);
  log(`REP ${index}: ROM ${rom} mm, ${(duration / 1000).toFixed(2)} s`, 'rep');
}

function handleSummary(dv) {
  const setNumber   = dv.getUint16(4, true);
  const repCount    = dv.getUint16(6, true);
  const baselineMM  = dv.getInt16(8, true);
  const sampleCount = dv.getUint16(10, true);
  const checksum    = dv.getUint32(12, true);

  log(`SET ${setNumber}: ${repCount} reps, baseline ${baselineMM} mm, ` +
      `${sampleCount} samples, checksum 0x${checksum.toString(16)}`, 'sum');

  if (sampleCount !== samples.length) {
    log(`  MISMATCH: summary says ${sampleCount}, received ${samples.length}`, 'err');
  } else {
    log('  sample count matches', 'ok');
  }
}

function onNotification(event) {
  const dv = event.target.value;

  packetCount++;
  byteCount += dv.byteLength;

  const type = dv.getUint8(0);
  const seq  = dv.getUint16(1, true);
  const len  = dv.getUint8(3);

  if (type === PKT_SAMPLES) {
    handleSamples(dv, seq, len);
  } else if (type === PKT_REP) {
    handleRep(dv);
  } else if (type === PKT_SET_SUMMARY) {
    handleSummary(dv);
  } else if (type === PKT_TX_END) {
    log('transfer complete', 'ok');
    drawCharts();
    csvBtn.disabled = samples.length === 0;
  } else {
    log(`unknown packet type 0x${type.toString(16)}`, 'err');
  }

  logHex(dv);
  updateStats();
}

// ---- charts -------------------------------------------------------------

function drawSeries(canvas, values, color, centerOnZero) {
  const ratio = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth;
  const cssH = parseInt(canvas.getAttribute('height'), 10);
  canvas.width  = cssW * ratio;
  canvas.height = cssH * ratio;
  canvas.style.height = cssH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  if (samples.length === 0) return;

  const padL = 44, padR = 10, padT = 10, padB = 22;
  const plotW = cssW - padL - padR;
  const plotH = cssH - padT - padB;

  const tMax = samples[samples.length - 1].t || 1;
  let vMin = Math.min.apply(null, values);
  let vMax = Math.max.apply(null, values);
  if (centerOnZero) {
    const m = Math.max(Math.abs(vMin), Math.abs(vMax)) || 1;
    vMin = -m; vMax = m;
  }
  if (vMax === vMin) vMax = vMin + 1;

  const x = t => padL + (t / tMax) * plotW;
  const y = v => padT + (1 - (v - vMin) / (vMax - vMin)) * plotH;

  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, padT + plotH);
  ctx.lineTo(padL + plotW, padT + plotH);
  ctx.stroke();

  ctx.fillStyle = '#888';
  ctx.font = '11px ui-monospace, monospace';
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(vMax), padL - 6, padT + 10);
  ctx.fillText(Math.round(vMin), padL - 6, padT + plotH);
  ctx.textAlign = 'left';
  ctx.fillText('0', padL, cssH - 6);
  ctx.textAlign = 'right';
  ctx.fillText((tMax / 1000).toFixed(1) + 's', padL + plotW, cssH - 6);

  if (centerOnZero) {
    ctx.strokeStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(padL, y(0));
    ctx.lineTo(padL + plotW, y(0));
    ctx.stroke();
  }

  ctx.fillStyle = color;
  for (let i = 0; i < samples.length; i++) {
    ctx.fillRect(x(samples[i].t) - 1, y(values[i]) - 1, 2, 2);
  }
}

function drawCharts() {
  drawSeries(document.getElementById('heightChart'),
             samples.map(s => s.height), '#5dcaa5', false);
  drawSeries(document.getElementById('accelChart'),
             samples.map(s => s.accel), '#f0997b', true);
}

window.addEventListener('resize', () => { if (samples.length) drawCharts(); });

// ---- csv ----------------------------------------------------------------

csvBtn.addEventListener('click', () => {
  const rows = ['time_ms,height_mm,accel_mg'];
  for (const s of samples) {
    rows.push(`${s.t},${s.height},${s.accel}`);
  }
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stacksense_set.csv';
  a.click();
});

// ---- ble ----------------------------------------------------------------

async function connect() {
  if (!navigator.bluetooth) {
    log('Web Bluetooth not available. On iOS use Bluefy; the page must be HTTPS.', 'err');
    return;
  }

  try {
    connectBtn.disabled = true;
    log('Requesting device...');

    // requestDevice() must be called from a user gesture, so this cannot
    // auto-reconnect. The filter needs the service UUID to be present in
    // the advertising packet.
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });

    log(`Selected: ${device.name || '(no name)'}`);

    device.addEventListener('gattserverdisconnected', () => {
      log('Disconnected.', 'err');
      connectBtn.disabled = false;
    });

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const chr     = await service.getCharacteristic(CHAR_UUID);

    await chr.startNotifications();
    chr.addEventListener('characteristicvaluechanged', onNotification);

    log('Subscribed. Waiting for packets...', 'ok');
  } catch (err) {
    log(`Error: ${err}`, 'err');
    connectBtn.disabled = false;
  }
}

connectBtn.addEventListener('click', connect);

document.getElementById('clearBtn').addEventListener('click', () => {
  logEl.textContent = '';
  packetCount = 0;
  byteCount = 0;
  samples = [];
  elapsedMs = 0;
  expectedSeq = 0;
  csvBtn.disabled = true;
  drawCharts();
  updateStats();
});
</script>

</body>
</html>
